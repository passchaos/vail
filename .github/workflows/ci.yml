name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64-debug
            os: ubuntu-latest
            optimize: Debug
            cpu: native
          - name: linux-x86_64-release-safe
            os: ubuntu-latest
            optimize: ReleaseSafe
            cpu: native
            bench_compile: true
          - name: linux-x86_64-release-safe-baseline
            os: ubuntu-latest
            optimize: ReleaseSafe
            cpu: baseline
          - name: linux-aarch64-debug
            os: ubuntu-24.04-arm
            optimize: Debug
            cpu: native
          - name: linux-aarch64-release-safe
            os: ubuntu-24.04-arm
            optimize: ReleaseSafe
            cpu: native
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out Vail
        uses: actions/checkout@v4
        with:
          path: vail

      - name: Check out Vort
        uses: actions/checkout@v4
        with:
          repository: passchaos/vort
          path: vort
          ref: b661c887e21fb1965db358bc6d12ea379d20178d
          token: ${{ secrets.VORT_TOKEN || github.token }}

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Format, generated-file, and test gates
        working-directory: vail
        run: >-
          zig build check
          -Doptimize=${{ matrix.optimize }}
          -Dcpu=${{ matrix.cpu }}

      - name: Build examples
        working-directory: vail
        run: >-
          zig build examples
          -Doptimize=${{ matrix.optimize }}
          -Dcpu=${{ matrix.cpu }}

      - name: Compile benchmark targets
        if: matrix.bench_compile
        working-directory: vail
        run: >-
          zig build bench-compile
          -Doptimize=${{ matrix.optimize }}
          -Dcpu=${{ matrix.cpu }}

      - name: OpenSSL interoperability smoke test
        if: matrix.optimize == 'Debug' && matrix.cpu == 'native'
        working-directory: vail
        run: >-
          zig build interop-openssl-p256-sign
          -Doptimize=${{ matrix.optimize }}
          -Dcpu=${{ matrix.cpu }}

  release-fast:
    name: release-fast (${{ matrix.name }})
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: linux-aarch64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out Vail
        uses: actions/checkout@v4
        with:
          path: vail

      - name: Check out Vort
        uses: actions/checkout@v4
        with:
          repository: passchaos/vort
          path: vort
          ref: b661c887e21fb1965db358bc6d12ea379d20178d
          token: ${{ secrets.VORT_TOKEN || github.token }}

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: ReleaseFast test suites
        working-directory: vail
        run: zig build test-all -Doptimize=ReleaseFast

      - name: Build examples
        working-directory: vail
        run: zig build examples -Doptimize=ReleaseFast

      - name: OpenSSL interoperability smoke test
        working-directory: vail
        run: zig build interop-openssl-p256-sign -Doptimize=ReleaseFast

  compile-targets:
    name: compile-targets
    runs-on: ubuntu-latest
    steps:
      - name: Check out Vail
        uses: actions/checkout@v4
        with:
          path: vail

      - name: Check out Vort
        uses: actions/checkout@v4
        with:
          repository: passchaos/vort
          path: vort
          ref: b661c887e21fb1965db358bc6d12ea379d20178d
          token: ${{ secrets.VORT_TOKEN || github.token }}

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build Windows target
        working-directory: vail
        run: zig build -Dtarget=x86_64-windows -Doptimize=ReleaseSafe

      - name: Build macOS targets
        working-directory: vail
        run: |
          zig build -Dtarget=aarch64-macos -Doptimize=ReleaseSafe
          zig build -Dtarget=x86_64-macos -Doptimize=ReleaseSafe
